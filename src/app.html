<!doctype html>
<html lang="en" data-theme="light">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<script>
			// Apply the saved theme before first paint to avoid a light flash in dark mode.
			(function () {
				var choice = null;
				try { choice = localStorage.getItem('theme'); } catch (error) {}
				var dark = choice === 'dark' || (choice !== 'light' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
				document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
